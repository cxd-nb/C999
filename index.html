<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型展示 CXD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">模型加载中...</div>
 
 <!-- 操作提示模态框 -->
  <div id="help-modal" class="modal">
    <div class="modal-content">
      <h2>操作指南</h2>
      <ul>
        <li>鼠标拖拽：旋转视角</li>
        <li>滚轮：缩放模型</li>
        <li>右键拖拽：平移视角</li>
        <li>暂时无法使用评论功能</li>
      </ul>
      <button id="close-modal">我知道了</button>
    </div>
  </div>
  
  <!-- 模型选择器 -->
  <div id="model-selector">
    <label for="model-select">选择模型：</label>
    <select id="model-select">
      <option value="models/model1.glb">C999的小屋</option>
      <option value="models/model2.glb">模型 2-暂无</option>
      <option value="models/model3.glb">模型 3-暂无</option>
    </select>
    <button id="reset-view" title="重置视角">回中</button>
  </div>

  <!-- 项目地址展示 -->
  <footer id="project-link">
    <a href="https://github.com/cxd-nb/C999" target="_blank" rel="noopener noreferrer">
      🔗 查看项目源代码
    </a>
    <span> | </span>
    <a href="https://space.bilibili.com/1897315082" target="_blank" rel="noopener noreferrer">
      🌐 模型作者 飞行社创新工坊
    </a>
    <span> | </span>
    <a href="https://cxd-blog.pages.dev/" target="_blank" rel="noopener noreferrer">
      🌐 网站作者 CXD
    </a>
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="main.js"></script>

  <!-- 评论按钮 -->
<button id="open-comments" title="查看评论">评论</button>

  <!-- 评论模态框 -->
  <div id="comments-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-comments" class="close-btn">&times;</span>
      <h2>评论</h2>
      <div id="comment-list"></div>
      <form id="comment-form">
        <input type="text" id="comment-author" placeholder="你的昵称" required>
        <textarea id="comment-content" placeholder="写下你的评论..." required></textarea>
        <button type="submit">发表</button>
      </form>
    </div>
  </div>
</body>
</html>
